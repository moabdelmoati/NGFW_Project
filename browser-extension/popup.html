<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGFW URL Interceptor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 350px;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
      color: #e6edf3;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid rgba(88, 166, 255, 0.3);
    }
    
    .header h1 {
      font-size: 20px;
      color: #58a6ff;
      margin-bottom: 8px;
    }
    
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
    }
    
    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .section {
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #7ee787;
    }
    
    .input-group {
      margin-bottom: 12px;
    }
    
    .input-group input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #e6edf3;
      font-size: 14px;
      outline: none;
    }
    
    .input-group input:focus {
      border-color: #58a6ff;
    }
    
    .btn {
      width: 100%;
      padding: 10px 16px;
      background: linear-gradient(135deg, #58a6ff 0%, #7ee787 100%);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .btn:hover {
      transform: scale(1.02);
    }
    
    .btn:active {
      transform: scale(0.98);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .result {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    
    .result.show {
      display: block;
    }
    
    .result.safe {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #7ee787;
    }
    
    .result.blocked {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 12px;
    }
    
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .toggle-switch.active {
      background: #22c55e;
    }
    
    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.3s;
    }
    
    .toggle-switch.active::after {
      transform: translateX(20px);
    }
    
    .stats {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    
    .stat-item {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: #58a6ff;
    }
    
    .stat-label {
      font-size: 11px;
      color: #9aa6b2;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ NGFW Security</h1>
    <div class="status">
      <span class="status-indicator"></span>
      <span id="statusText">نشط</span>
    </div>
  </div>

  <div class="section">
    <div class="toggle">
      <span>تفعيل الحماية</span>
      <div class="toggle-switch active" id="toggleSwitch"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">فحص رابط</div>
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="أدخل الرابط للفحص...">
    </div>
    <button class="btn" id="checkBtn">فحص الرابط</button>
    <div class="result" id="result"></div>
  </div>

  <div class="stats">
    <div class="stat-item">
      <div class="stat-value" id="blockedCount">0</div>
      <div class="stat-label">روابط محظورة</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
